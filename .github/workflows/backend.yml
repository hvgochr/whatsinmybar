name: Backend CI

on:
  pull_request:
    paths:
      - ".github/workflows/backend.yml"
      - "apps/api/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/backend.yml"
      - "apps/api/**"

jobs:
  backend:
    name: Symfony backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: whatsinmybar
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d whatsinmybar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      APP_SECRET: ci-test-secret
      DATABASE_URL: "postgresql://app:app@127.0.0.1:5432/whatsinmybar?serverVersion=16&charset=utf8"
      CORS_ALLOW_ORIGIN: "^https?://(localhost|127\\.0\\.0\\.1)(:[0-9]+)?$"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl, pdo_pgsql, zip
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Audit dependencies
        run: composer security:audit

      - name: Warm up Symfony cache
        run: php bin/console cache:clear

      - name: Check coding standards
        run: composer cs:check

      - name: Run static analysis
        run: composer phpstan

      - name: Run PHPUnit
        run: composer test

      - name: Prepare test database
        run: composer db:create

      - name: Validate Doctrine schema
        run: composer db:validate

      - name: Check migrations dry-run
        run: composer migrations:dry-run
