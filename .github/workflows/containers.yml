name: Production Containers CI

on:
  pull_request:
    paths:
      - ".dockerignore"
      - ".env.prod.example"
      - ".github/workflows/containers.yml"
      - ".github/workflows/images.yml"
      - "Makefile"
      - "apps/api/**"
      - "apps/web/**"
      - "compose.prod.yaml"
      - "infra/**"
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - ".env.prod.example"
      - ".github/workflows/containers.yml"
      - ".github/workflows/images.yml"
      - "Makefile"
      - "apps/api/**"
      - "apps/web/**"
      - "compose.prod.yaml"
      - "infra/**"

permissions:
  contents: read

concurrency:
  group: production-containers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  containers:
    name: Production configuration, images and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Check operations scripts
        run: make check-ops
      - name: Validate Caddy site block
        run: >-
          docker run --rm
          --volume "${PWD}/infra/caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Build and check production containers
        run: make check-containers
      - name: Check disposable production stack
        run: bash infra/ops/test-production.sh
