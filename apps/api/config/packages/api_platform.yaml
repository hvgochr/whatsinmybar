api_platform:
    title: What's In My Bar API
    description: API for cocktail discovery, recipe authoring, community features, and moderation.
    version: 1.0.0
    formats:
        json:
            mime_types: ['application/json']
        jsonld:
            mime_types: ['application/ld+json']
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
