gesdinet_jwt_refresh_token:
    refresh_token_class: App\Entity\RefreshToken
    ttl: 2592000
    ttl_update: true
    single_use: true
    cookie:
        enabled: true
        same_site: strict
        path: /
        http_only: true
        secure: '%env(bool:REFRESH_TOKEN_COOKIE_SECURE)%'
        remove_token_from_body: true

when@test:
    gesdinet_jwt_refresh_token:
        cookie:
            secure: true
