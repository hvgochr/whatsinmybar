# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.avatar_uploads_dir: '%kernel.project_dir%/public/uploads/avatars'
    app.avatar_public_path_prefix: '/uploads/avatars'
    app.recipe_image_uploads_dir: '%kernel.project_dir%/public/uploads/recipes'
    app.recipe_image_public_path_prefix: '/uploads/recipes'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Service\Upload\AvatarStorageInterface:
        alias: 'app.upload.avatar_storage'

    App\Service\Upload\RecipeImageStorageInterface:
        alias: 'app.upload.recipe_image_storage'

    App\Command\SeedDevDataCommand:
        arguments:
            $environment: '%kernel.environment%'

    app.upload.avatar_storage:
        class: App\Service\Upload\LocalImageStorage
        arguments:
            $targetDirectory: '%app.avatar_uploads_dir%'
            $publicPathPrefix: '%app.avatar_public_path_prefix%'
            $maxSizeBytes: 2097152
            $label: 'Avatar'
            $outputDimension: 512

    app.upload.recipe_image_storage:
        class: App\Service\Upload\LocalImageStorage
        arguments:
            $targetDirectory: '%app.recipe_image_uploads_dir%'
            $publicPathPrefix: '%app.recipe_image_public_path_prefix%'
            $maxSizeBytes: 5242880
            $label: 'Recipe image'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    parameters:
        app.avatar_uploads_dir: '%kernel.project_dir%/var/test-uploads/avatars'
        app.recipe_image_uploads_dir: '%kernel.project_dir%/var/test-uploads/recipes'
