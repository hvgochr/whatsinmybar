name: whatsinmybar-prod

services:
  api:
    image: ${API_IMAGE:?Set API_IMAGE from the CI release.env}
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_DEBUG: "0"
      ABUSE_LOGIN_IP_LIMIT: ${ABUSE_LOGIN_IP_LIMIT:-40}
      ABUSE_LOGIN_ACCOUNT_LIMIT: ${ABUSE_LOGIN_ACCOUNT_LIMIT:-8}
      ABUSE_LOGIN_INTERVAL: ${ABUSE_LOGIN_INTERVAL:-15 minutes}
      ABUSE_REGISTRATION_LIMIT: ${ABUSE_REGISTRATION_LIMIT:-5}
      ABUSE_REGISTRATION_INTERVAL: ${ABUSE_REGISTRATION_INTERVAL:-1 hour}
      ABUSE_WRITES_LIMIT: ${ABUSE_WRITES_LIMIT:-120}
      ABUSE_WRITES_INTERVAL: ${ABUSE_WRITES_INTERVAL:-10 minutes}
      ABUSE_COMMENTS_LIMIT: ${ABUSE_COMMENTS_LIMIT:-20}
      ABUSE_COMMENTS_INTERVAL: ${ABUSE_COMMENTS_INTERVAL:-10 minutes}
      ABUSE_REPORTS_LIMIT: ${ABUSE_REPORTS_LIMIT:-5}
      ABUSE_REPORTS_INTERVAL: ${ABUSE_REPORTS_INTERVAL:-1 hour}
      ABUSE_RECIPES_LIMIT: ${ABUSE_RECIPES_LIMIT:-60}
      ABUSE_RECIPES_INTERVAL: ${ABUSE_RECIPES_INTERVAL:-10 minutes}
      ABUSE_UPLOADS_LIMIT: ${ABUSE_UPLOADS_LIMIT:-10}
      ABUSE_UPLOADS_INTERVAL: ${ABUSE_UPLOADS_INTERVAL:-10 minutes}
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env.prod}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:?Set CORS_ALLOW_ORIGIN in .env.prod}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.prod}
      DEFAULT_URI: https://${APP_DOMAIN:?Set APP_DOMAIN in .env.prod}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.prod}
      SYMFONY_TRUSTED_PROXIES: ${CADDY_PROXY_IP:?Set the actual Caddy IPv4 on proxy},${WEB_INTERNAL_IP:-172.30.72.3}
      REFRESH_TOKEN_COOKIE_SECURE: "1"
    expose:
      - "8080"
    volumes:
      - api_uploads:/app/public/uploads
      - api_abuse:/app/var/abuse
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "$$c = stream_context_create(['http' => ['timeout' => 2, 'header' => 'Accept: application/json']]); exit(@file_get_contents('http://127.0.0.1:8080/api/categories?page=1', false, $$c) === false ? 1 : 0);"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    networks:
      database:
      app:
        aliases:
          - whatsinmybar-api-internal
      proxy:
        aliases:
          - whatsinmybar-api

  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE from the CI release.env}
    restart: unless-stopped
    logging: *logging
    environment:
      NUXT_API_BASE_URL: http://whatsinmybar-api-internal:8080/api
      NUXT_TRUSTED_PROXY_IP: ${CADDY_PROXY_IP:?Set the actual Caddy IPv4 on proxy}
      NUXT_PUBLIC_API_BASE_URL: /api
      NUXT_PUBLIC_SITE_URL: https://${APP_DOMAIN:?Set APP_DOMAIN in .env.prod}
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/robots.txt').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      app:
        ipv4_address: ${WEB_INTERNAL_IP:-172.30.72.3}
      proxy:
        aliases:
          - whatsinmybar-web

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - database

networks:
  database:
    internal: true
  app:
    internal: true
    ipam:
      config:
        - subnet: ${APP_SUBNET:-172.30.72.0/24}
          ip_range: ${APP_IP_RANGE:-172.30.72.128/25}
  proxy:
    external: true
    name: proxy

volumes:
  api_abuse:
  api_uploads:
  postgres_data:
