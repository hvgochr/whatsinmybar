name: whatsinmybar

services:
  caddy:
    image: caddy:2-alpine
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      whatsinmybar:
        ipv4_address: 172.30.71.2

  api:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
      target: development
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ABUSE_LOGIN_IP_LIMIT: ${ABUSE_LOGIN_IP_LIMIT:-40}
      ABUSE_LOGIN_ACCOUNT_LIMIT: ${ABUSE_LOGIN_ACCOUNT_LIMIT:-8}
      ABUSE_LOGIN_INTERVAL: ${ABUSE_LOGIN_INTERVAL:-15 minutes}
      ABUSE_REGISTRATION_LIMIT: ${ABUSE_REGISTRATION_LIMIT:-5}
      ABUSE_REGISTRATION_INTERVAL: ${ABUSE_REGISTRATION_INTERVAL:-1 hour}
      ABUSE_WRITES_LIMIT: ${ABUSE_WRITES_LIMIT:-120}
      ABUSE_WRITES_INTERVAL: ${ABUSE_WRITES_INTERVAL:-10 minutes}
      ABUSE_COMMENTS_LIMIT: ${ABUSE_COMMENTS_LIMIT:-20}
      ABUSE_COMMENTS_INTERVAL: ${ABUSE_COMMENTS_INTERVAL:-10 minutes}
      ABUSE_REPORTS_LIMIT: ${ABUSE_REPORTS_LIMIT:-5}
      ABUSE_REPORTS_INTERVAL: ${ABUSE_REPORTS_INTERVAL:-1 hour}
      ABUSE_RECIPES_LIMIT: ${ABUSE_RECIPES_LIMIT:-60}
      ABUSE_RECIPES_INTERVAL: ${ABUSE_RECIPES_INTERVAL:-10 minutes}
      ABUSE_UPLOADS_LIMIT: ${ABUSE_UPLOADS_LIMIT:-10}
      ABUSE_UPLOADS_INTERVAL: ${ABUSE_UPLOADS_INTERVAL:-10 minutes}
      APP_ENV: dev
      APP_SECRET: dev-only-change-me
      CORS_ALLOW_ORIGIN: '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$'
      DATABASE_URL: 'postgresql://app:app@postgres:5432/whatsinmybar?serverVersion=16&charset=utf8'
      DEFAULT_URI: 'http://localhost:8080'
      JWT_SECRET: dev-only-change-me-at-least-32-bytes
      SYMFONY_TRUSTED_PROXIES: 172.30.71.2,172.30.71.3
      REFRESH_TOKEN_COOKIE_SECURE: "0"
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./apps/api:/app
      - api_uploads:/app/public/uploads
      - api_vendor:/app/vendor
      - api_var:/app/var
    networks:
      - whatsinmybar

  web:
    build:
      context: .
      dockerfile: infra/docker/web/Dockerfile
      target: development
    environment:
      CHOKIDAR_USEPOLLING: "true"
      NUXT_API_BASE_URL: http://api/api
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: "3000"
      NUXT_TRUSTED_PROXY_IP: 172.30.71.2
      NUXT_PUBLIC_API_BASE_URL: /api
      PNPM_HOME: /pnpm
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_nuxt:/app/.nuxt
      - web_pnpm_store:/pnpm/store
    networks:
      whatsinmybar:
        ipv4_address: ${WEB_CONTAINER_IP:-172.30.71.3}

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: whatsinmybar
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d whatsinmybar"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - whatsinmybar

networks:
  whatsinmybar:
    ipam:
      config:
        - subnet: 172.30.71.0/24
          ip_range: 172.30.71.128/25

volumes:
  api_uploads:
  api_var:
  api_vendor:
  caddy_config:
  caddy_data:
  postgres_data:
  web_node_modules:
  web_nuxt:
  web_pnpm_store:
